name: Monitor

# Confere de fora do servidor se o GiG está no ar. Se falhar, o GitHub manda e-mail
# para quem configurou este agendamento (022).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API responde ao healthcheck
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://gigreat.online/api/health
      - name: Página inicial carrega
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://gigreat.online/
