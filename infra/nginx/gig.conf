server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Um pouco acima do limite de 5 MB do extrato, para a API responder o erro padrão.
    client_max_body_size 6m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nginx só resolve o nome do serviço quando há resolver e variável: assim sobe sem o web.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location /webhooks/ {
        set $api http://api:3000;
        proxy_pass $api;
    }

    location / {
        set $web http://web:3000;
        proxy_pass $web;
    }
}
